services:
  db:
    image: docker.io/library/postgres:16
    container_name: umbc_parking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Note: ./sql is intentionally NOT mounted into /docker-entrypoint-initdb.d.
    # Postgres runs every file it finds there alphabetically on first init
    # (createDDL.sql, then dropDDL.sql, then indexAll.sql, ...), which drops
    # the schema right after creating it and then fails on the rest. The
    # db-runner service below runs the files in the correct explicit order
    # instead.

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: umbc_parking_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  db-runner:
    image: localhost/umbc-db-runner:latest
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: umbc_parking_db_runner
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Ordered init sequence: schema, then seed data, then indexes.
      # dropDDL.sql, queryAll.sql, and transaction.sql are intentionally
      # excluded — they are meant to be run manually (see README).
      SQL_FILES: /app/sql/createDDL.sql,/app/sql/loadAll.sql,/app/sql/indexAll.sql
    volumes:
      - ./sql:/app/sql:Z
    restart: "no"

volumes:
  postgres_data:
  pgadmin_data:
