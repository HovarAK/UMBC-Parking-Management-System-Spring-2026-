services:
  db:
    image: docker.io/library/postgres:16
    container_name: umbc_parking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:Z

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: umbc_parking_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  db_runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: umbc_parking_db_runner
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SQL_FILE: /app/sql/createDDL.sql
    volumes:
      - ./sql:/app/sql:Z
    restart: "no"

volumes:
  postgres_data:
  pgadmin_data:
