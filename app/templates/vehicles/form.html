{% extends "base.html" %}
{% block title %}New vehicle{% endblock %}
{% block content %}
<h1>New vehicle</h1>
<div class="form-card">
  <form method="post">
    <div class="form-row">
      <label for="plate_number">Plate number</label>
      <input id="plate_number" name="plate_number" type="text" required>
    </div>
    <div class="form-row">
      <label for="make">Make</label>
      <input id="make" name="make" type="text" required>
    </div>
    <div class="form-row">
      <label for="model">Model</label>
      <input id="model" name="model" type="text" required>
    </div>
    <div class="form-row">
      <label for="color">Color</label>
      <input id="color" name="color" type="text" required>
    </div>
    <div class="form-row">
      <label for="user_id">Owner</label>
      <select id="user_id" name="user_id" required>
        <option value="">Select a user&hellip;</option>
        {% for u in users %}
        <option value="{{ u.user_id }}">{{ u.first_name }} {{ u.last_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="btn-row">
      <button class="btn" type="submit">Add vehicle</button>
      <a class="btn btn-secondary" href="{{ url_for('vehicles.list_vehicles') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
